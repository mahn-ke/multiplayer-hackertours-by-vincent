#http
version: "3.8"

services:
  app:
    image: ghcr.io/mahn-ke/multiplayer-hackertours-by-vincent:latest
    restart: on-failure:5
    environment:
      - PORT=3022
    ports:
      - "3022:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3022/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
