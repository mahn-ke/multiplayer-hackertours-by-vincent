#http
version: "3.8"

services:
  app:
    image: ghcr.io/mahn-ke/multiplayer-hackertours-by-vincent:latest
    restart: on-failure:5
    environment:
      - OAUTH_URL=${OAUTH_URL:-https://sso.by.vincent.mahn.ke/realms/sso.by.vincent.mahn.ke}
      - OAUTH_CONSOLE_3DS_CLIENT_ID=${OAUTH_CONSOLE_3DS_CLIENT_ID:-}
      - OAUTH_CONSOLE_XBOX_CLIENT_ID=${OAUTH_CONSOLE_XBOX_CLIENT_ID:-}
      - OAUTH_CONSOLE_SWITCH_CLIENT_ID=${OAUTH_CONSOLE_SWITCH_CLIENT_ID:-}
      - OAUTH_CONSOLE_GBA_CLIENT_ID=${OAUTH_CONSOLE_GBA_CLIENT_ID:-}
      - TRUST_PROXY=${TRUST_PROXY:-1}
    ports:
      - "3022:3000"
